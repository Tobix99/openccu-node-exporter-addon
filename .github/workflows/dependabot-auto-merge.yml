name: Dependabot auto-merge

# Merges Dependabot PRs once the Build workflow succeeded on their latest commit
on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge pull request
        run: |
          set -e
          AUTHOR=$(gh pr view "${HEAD_BRANCH}" --json author --jq '.author.login')
          if [ "${AUTHOR}" != "app/dependabot" ]; then
            echo "PR author is ${AUTHOR}, not Dependabot; skipping"
            exit 0
          fi
          gh pr merge "${HEAD_BRANCH}" --squash --delete-branch --match-head-commit "${HEAD_SHA}"
