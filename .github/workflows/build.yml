name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint shell scripts
        run: shellcheck update_script rc.d/node_exporter tests/verify-tarball.sh tests/verify-tarball.sh
      - name: Verify tarball
        run: make verify

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: addon-tarball
          path: dist/openccu-prometheus-node-exporter-*.tar.gz
