name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tarball
        run: make verify

      - name: Check version matches pinned node_exporter
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          PINNED=$(cat .node_exporter_version)
          if [ "${INPUT_VERSION}" != "${PINNED}" ]; then
            echo "Input version ${INPUT_VERSION} does not match pinned node_exporter version ${PINNED}" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            dist/openccu-prometheus-node-exporter-*.tar.gz \
            --title "v${VERSION}" \
            --generate-notes
